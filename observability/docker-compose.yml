# Monitoring stack for civic-agent. Start the agent with metrics first:
#   uv run civic-load --metrics-port 9464        (traffic from the evaluation set)
#   OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318 uv run civic-load   (also send traces)
# Then: docker compose -f observability/docker-compose.yml up -d
#   Grafana http://localhost:3000 (anonymous viewer)   Prometheus http://localhost:9090   Jaeger http://localhost:16686
services:
  prometheus:
    image: prom/prometheus:v3.4.0
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts.yml:/etc/prometheus/alerts.yml:ro
    ports: ["9090:9090"]
    extra_hosts: ["host.docker.internal:host-gateway"]
  grafana:
    image: grafana/grafana:12.0.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
  jaeger:
    image: jaegertracing/all-in-one:1.69.0
    ports: ["16686:16686", "4318:4318"]
